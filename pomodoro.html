<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>25:00 - Synkad Pomodoro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <style>
        /* ─────────────────────────────────────────────────────────────
           "Kolofon" — mörk, boklik scen där tiden är enda ljuskällan.
           Cormorant Garamond över Lora, hårfina linjer, guld som streck.
           ───────────────────────────────────────────────────────────── */
        :root {
            --k-ground: #1a1917;
            --k-ink: #f3f2f2;
            --k-ink-strong: #f8f4f4;
            --k-dim: #9b9797;
            --k-line: rgba(243, 242, 242, 0.22);
            --k-line-soft: rgba(243, 242, 242, 0.16);
            --k-accent: #b68235;
            --k-accent-text: #e1ad66;
            --k-accent-hi: #facb8d;
            --k-accent-wash: rgba(182, 130, 53, 0.13);
            --k-accent-wash-strong: rgba(182, 130, 53, 0.24);

            --font-heading: "Cormorant Garamond", Georgia, "Times New Roman", serif;
            --font-body: "Lora", Georgia, serif;
            --radius-md: 4px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--k-ground);
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 28px clamp(20px, 4vw, 56px) 26px;
            color: var(--k-ink);
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 {
            margin: 0;
            font-family: var(--font-heading);
            font-weight: 400;
            line-height: 1.1;
        }

        a { color: var(--k-accent-text); text-decoration: none; }
        a:hover { color: var(--k-accent-hi); }

        .tnum { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }

        ::placeholder { color: var(--k-dim); opacity: 0.8; }
        ::selection { background: rgba(182, 130, 53, 0.3); }
        :focus { outline: none; }
        :focus-visible { outline: 2px solid var(--k-accent); outline-offset: 2px; }

        /* ── Sidhuvud ─────────────────────────────────────────────── */
        .app-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 14px;
            min-width: 0;
        }

        .brand-name {
            font-family: var(--font-heading);
            font-size: 26px;
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        #current-room-text {
            font-family: var(--font-heading);
            font-size: 14px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--k-accent-text);
        }

        .header-tools {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        /* ── Sök / gå in i rum ────────────────────────────────────── */
        .room-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 240px;
            padding: 9px 13px;
            border: 1px solid var(--k-line);
            border-radius: var(--radius-md);
        }

        .room-controls .field-icon {
            flex: none;
            color: var(--k-dim);
        }

        #room-input {
            flex: 1;
            min-width: 0;
            padding: 0;
            background: transparent;
            border: 0;
            outline: none;
            color: inherit;
            font-family: var(--font-body);
            font-size: 15px;
        }

        #join-btn {
            padding: 0;
            background: transparent;
            border: 0;
            cursor: pointer;
            font-family: var(--font-heading);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--k-accent-text);
            transition: color 0.15s ease;
        }

        #join-btn:hover { color: var(--k-accent-hi); }

        /* ── Ikonknappar (musik + inställningar) ──────────────────── */
        .music-container,
        .settings-container { position: relative; }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            padding: 0;
            border: 1px solid var(--k-line);
            border-radius: 50%;
            background: transparent;
            color: var(--k-dim);
            font-size: 17px;
            line-height: 1;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
        }

        .icon-btn svg { display: block; }

        .icon-btn:hover {
            color: var(--k-accent-text);
            border-color: var(--k-accent);
            background: var(--k-accent-wash);
        }

        #music-toggle { color: var(--k-accent-text); }

        /* ── Uppfällbara paneler ─────────────────────────────────── */
        .popover {
            position: absolute;
            top: calc(100% + 12px);
            right: 0;
            z-index: 100;
            width: 264px;
            padding: 0 18px;
            background: #211f1c;
            border: 1px solid var(--k-line);
            border-radius: var(--radius-md);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
        }

        .popover.open {
            max-height: 360px;
            padding: 18px;
            opacity: 1;
            pointer-events: auto;
        }

        .popover h3 {
            margin: 0 0 14px;
            font-family: var(--font-heading);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--k-dim);
        }

        .field-group + .field-group { margin-top: 14px; }

        .field-group label {
            display: block;
            margin-bottom: 6px;
            font-family: var(--font-body);
            font-size: 12px;
            letter-spacing: 0.02em;
            color: var(--k-dim);
        }

        .field-group input {
            width: 100%;
            padding: 8px 10px;
            background: var(--k-ground);
            border: 1px solid var(--k-line);
            border-radius: var(--radius-md);
            color: var(--k-ink);
            font-family: var(--font-body);
            font-size: 14px;
        }

        .field-group input:focus-visible { border-color: var(--k-accent); }

        .station-select {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 14px;
            background: var(--k-ground);
            color: var(--k-ink);
            border: 1px solid var(--k-line);
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 13px;
            cursor: pointer;
        }

        .station-select:focus-visible { border-color: var(--k-accent); }

        .custom-audio-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .radio-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 13px;
            background: transparent;
            border: 1px solid var(--k-line);
            border-radius: var(--radius-md);
            color: var(--k-ink);
            font-family: var(--font-heading);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
        }

        .radio-btn:hover {
            color: var(--k-accent-text);
            border-color: var(--k-accent);
            background: var(--k-accent-wash);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border: 1px solid var(--k-line);
            border-radius: var(--radius-md);
        }

        #mute-btn {
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
        }

        #volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 78px;
            background: transparent;
            cursor: pointer;
        }

        #volume-slider::-webkit-slider-runnable-track {
            height: 2px;
            background: var(--k-line);
            border-radius: 2px;
        }

        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            margin-top: -5px;
            border-radius: 50%;
            background: var(--k-accent);
        }

        #volume-slider::-moz-range-track {
            height: 2px;
            background: var(--k-line);
        }

        #volume-slider::-moz-range-thumb {
            height: 12px;
            width: 12px;
            border: 0;
            border-radius: 50%;
            background: var(--k-accent);
        }

        /* ── Hårfin linje ────────────────────────────────────────── */
        .rule { height: 1px; background: var(--k-line-soft); }
        .app-header + .rule { margin-top: 18px; }

        /* ── Scen: tiden ─────────────────────────────────────────── */
        .stage {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px 0;
            text-align: center;
        }

        .ghost {
            position: absolute;
            left: 50%;
            top: 46%;
            transform: translate(-50%, -50%);
            font-family: var(--font-heading);
            font-weight: 300;
            font-size: min(42vh, 36vw);
            line-height: 1;
            color: var(--k-accent);
            opacity: 0.09;
            pointer-events: none;
            user-select: none;
        }

        .kicker {
            position: relative;
            font-family: var(--font-heading);
            font-size: 16px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--k-accent-text);
        }

        #timer-display {
            position: relative;
            margin: 0;
            font-family: var(--font-heading);
            font-weight: 300;
            font-size: clamp(112px, 17vw, 200px);
            line-height: 0.9;
            letter-spacing: -0.02em;
            color: var(--k-ink-strong);
        }

        #mode-display {
            position: relative;
            max-width: 34ch;
            font-family: var(--font-heading);
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--k-dim);
        }

        .marks {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }

        .marks span {
            width: 46px;
            height: 2px;
            background: var(--k-accent);
        }

        .marks span.half { opacity: 0.55; }
        .marks span.empty { background: var(--k-line); }

        /* ── Sidfot: åtgärder + deltagare ────────────────────────── */
        .app-footer {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 15px 34px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            color: var(--k-ink);
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 18px;
            letter-spacing: 0.03em;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
        }

        .btn-primary {
            color: var(--k-accent-text);
            border-color: var(--k-accent);
        }

        .btn-primary:hover {
            color: var(--k-accent-hi);
            background: var(--k-accent-wash);
        }

        .btn-primary:active { background: var(--k-accent-wash-strong); }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn:disabled:hover {
            color: var(--k-accent-text);
            background: transparent;
        }

        .footer-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px 24px;
            min-height: 40px;
        }

        .roster { display: flex; gap: 8px; }

        .roster span {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: 1px solid var(--k-line);
            border-radius: 50%;
            font-family: var(--font-heading);
            font-size: 15px;
            color: var(--k-dim);
        }

        .roster span.host {
            border-color: var(--k-accent);
            color: var(--k-accent-text);
        }

        #motivation-display {
            margin: 0;
            font-family: var(--font-body);
            font-style: italic;
            font-size: 16px;
            color: var(--k-dim);
        }

        /* ── Mindre skärmar ─────────────────────────────────────── */
        @media (max-width: 640px) {
            body { padding: 20px 16px 22px; }
            .header-tools { width: 100%; justify-content: space-between; }
            .room-controls { flex: 1; min-width: 0; }
            .footer-row { justify-content: center; text-align: center; }
        }

        @media (max-width: 520px) {
            .music-container .popover { right: auto; left: 0; }
            .popover { width: min(280px, calc(100vw - 40px)); }
            #mode-display { font-size: 14px; letter-spacing: 0.1em; }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <h1 class="brand-name">Synkad Pomodoro</h1>
            <span id="current-room-text"></span>
        </div>

        <div class="header-tools">
            <div class="room-controls">
                <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-3.5-3.5"></path>
                </svg>
                <input type="text" id="room-input" placeholder="Sök eller skapa rum…">
                <button id="join-btn">Gå in</button>
            </div>

            <div class="music-container">
                <button id="music-toggle" class="icon-btn" title="Ljud och musik" aria-label="Ljud och musik">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                    </svg>
                </button>

                <div id="music-content" class="popover music-content">
                    <h3>Fokusradio</h3>

                    <select id="station-select" class="station-select">
                        <option value="https://ice5.somafm.com/illstreet-128-mp3">Illinois Street Lounge (Jazz)</option>
                        <option value="https://play.streamafrica.net/lofiradio">Chill Beats (Lo-Fi)</option>
                        <option value="https://streaming.live365.com/a43749">New York (Jazz med reklam)</option>
                        <option value="https://ice1.somafm.com/poptron-128-mp3">POP Tron (Fest)</option>
                    </select>

                    <audio id="focus-radio" preload="none">
                        <source src="https://ice5.somafm.com/illstreet-128-mp3" type="audio/mpeg">
                    </audio>

                    <div class="custom-audio-controls">
                        <button id="play-pause-btn" class="radio-btn">▶️ Spela</button>

                        <div class="volume-container">
                            <span id="mute-btn">🔊</span>
                            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
                        </div>
                    </div>
                </div>
            </div>

            <div class="settings-container">
                <button id="settings-toggle" class="icon-btn" title="Inställningar" aria-label="Inställningar">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>

                <div id="settings-content" class="popover settings-content">
                    <h3>Inställningar</h3>

                    <div class="field-group">
                        <label for="user-name">Ditt namn</label>
                        <input type="text" id="user-name" maxlength="40" autocomplete="off" spellcheck="false">
                    </div>

                    <div class="field-group">
                        <label for="focus-duration">Fokustid (minuter)</label>
                        <input type="number" id="focus-duration" min="1" max="60" value="25">
                    </div>

                    <div class="field-group">
                        <label for="break-duration">Rasttid (minuter)</label>
                        <input type="number" id="break-duration" min="1" max="30" value="5">
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="rule"></div>

    <main class="stage">
        <div class="ghost" aria-hidden="true">1</div>

        <div class="kicker">Gemensam tidshantering</div>
        <h2 id="timer-display" class="tnum">25:00</h2>
        <h3 id="mode-display">Gå med i ett rum för att börja</h3>

        <div class="marks" aria-hidden="true">
            <span></span>
            <span></span>
            <span class="half"></span>
            <span class="empty"></span>
        </div>
    </main>

    <footer class="app-footer">
        <div class="actions">
            <button id="start-btn" class="btn btn-primary">Starta timer</button>
        </div>

        <div class="rule"></div>

        <div class="footer-row">
            <div class="roster" id="roster"></div>
            <p id="motivation-display">Fyra i rummet, alla i samma minut.</p>
        </div>
    </footer>

    <audio id="alarm-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="/pomodoro/script.js"></script>
    <script src="/pomodoro/radio.js"></script>
</body>
</html>
