<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/projects.css">
    <title>Personliga Projekt</title>
</head>
<body>
    <header class="site-nav" role="banner">
        <div class="nav-inner">
            <a href="../index.html" class="brand">Rickard Hjerpe</a>
            <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">
            <label for="nav-toggle" class="nav-toggle-label" aria-hidden="true">
                <span></span>
            </label>
            <nav class="nav-links" role="navigation" aria-label="Huvudnavigation">
                <a href="../utbildning.html">Utbildning</a>
                <a href="../jobb.html">Jobb</a>
                <a href="../personligt.html">Personligt</a>
                <a href="../pomodoro.html">Min pomodoro timer</a>
            </nav>
        </div>
    </header>

    <section class="project">
        <div class="project-image">
            <img src="../bilder/heatmap/cafe_stockholm_no_nodes.png" alt="Heatmap visualisering i React">
        </div>
        <div class="project-info">
            <h2 class="project-title">Heatmap</h2>
            <p class="project-period">Maj 2026</p>
            <p class="project-desc">
                En heatmap som visar var det finns högst koncentration av ett vist sökord, t.ex. "bar" eller "cafe".
            </p>
            <a href="../jobb/heatmap.html">Se projektet →</a>
        </div>
    </section>

    <button class="contact-bubble" id="contact-open" aria-haspopup="dialog" aria-controls="contact-modal" aria-expanded="false">
            <img src="../bilder/kontakt.JPG" alt="Kontakt" />
    </button>
    <div class="contact-tooltip" id="contact-tooltip">Säg hej!</div>

    <div class="contact-modal" id="contact-modal" role="dialog" aria-modal="true" aria-hidden="true">
            <div class="contact-modal-panel" role="document">
                    <button class="contact-close" id="contact-close" aria-label="Stäng kontakt">✕</button>
                    <div class="contact-content">
                            <h3>Kontakt</h3>
                            <p><strong>E-post:</strong> <a href="mailto:rickard.hjerpe@gmail.com">rickard.hjerpe@gmail.com</a></p>
                            <p><strong>LinkedIn:</strong> <a href="https://www.linkedin.com/in/rickard-hjerpe" target="_blank">www.linkedin.com/in/rickard-hjerpe</a></p>
                    </div>
            </div>
    </div>

    <script>
        // Samma script som tidigare för att hantera kontakt-modalen
        (function(){
            const openBtn = document.getElementById('contact-open');
            const modal = document.getElementById('contact-modal');
            const closeBtn = document.getElementById('contact-close');
            const panel = modal.querySelector('.contact-modal-panel');
            
            function openModal(){
                modal.setAttribute('aria-hidden','false');
                document.body.style.overflow = 'hidden';
                requestAnimationFrame(()=>{
                    panel.style.opacity = '1';
                    panel.style.transform = 'scale(1)';
                });
            }

            function closeModal(){
                modal.setAttribute('aria-hidden','true');
                document.body.style.overflow = '';
            }

            openBtn.addEventListener('click', openModal);
            closeBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });
        })();
    </script>
</body>
</html>
