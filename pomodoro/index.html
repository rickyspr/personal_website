<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>25:00 - Synkad Pomodoro</title>
    
    <style>
        /* Grundinställningar för hela sidan */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Ett snyggare, modernt typsnitt */
            background-color: #1a1a2e; /* Mörkblå bakgrund */
            color: white; /* Vit text */
            display: flex;
            flex-direction: column;
            align-items: center; /* Centrerar allt innehåll horisontellt */
            justify-content: center;
            min-height: 100vh; /* Tar upp hela skärmens höjd */
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
            color: #e94560; /* En röd accentfärg för titeln */
        }

        /* En liten beskrivningstext under titeln */
        .subtitle {
            color: #888;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        /* Design för rums-sektionen */
        .room-controls {
            background-color: #16213e; /* Lite ljusare mörkblå för kortet */
            padding: 20px;
            border-radius: 10px; /* Rundade hörn */
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); /* En liten skugga för djup */
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px; /* Gör att det inte blir för brett på stora skärmar */
            text-align: center;
        }

        input[type="text"] {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #0f3460;
            background-color: #0f3460;
            color: white;
            width: 70%;
            margin-right: 10px;
        }

        /* Grunddesign för alla knappar */
        button {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s; /* En mjuk övergång vid hover */
        }

        /* Specifik design för "Gå med"-knappen */
        #join-btn {
            background-color: #0f3460;
            color: white;
        }

        #join-btn:hover {
            background-color: #e94560; /* Blir röd när man håller musen över */
        }

        /* Design för status-texten "Du är i rum..." */
        #current-room-text {
            display: block; /* Lägger den på en egen rad */
            margin-top: 15px;
            color: #4caf50; /* Grön färg */
            font-weight: bold;
        }

        /* Design för timer-sektionen */
        .timer-container {
            background-color: #16213e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        #mode-display {
            margin-top: 0;
            color: #888;
            font-size: 1.1em;
        }

        /* Jättestor design för själva klockan */
        #timer-display {
            font-size: 80px;
            font-weight: bold;
            margin: 20px 0;
            font-family: 'Courier New', Courier, monospace; /* Monospace passar bra för klockor */
            letter-spacing: -2px;
        }

        /* Design för den stora "Starta timer"-knappen */
        #start-btn {
            background-color: #e94560; /* Röd accentfärg */
            color: white;
            font-size: 1.2em;
            width: 100%;
            padding: 15px;
        }

        #start-btn:hover {
            background-color: #ff5e78; /* Lite ljusare röd vid hover */
        }

        /* Design när knappen är inaktiverad (medan timern körs) */
        #start-btn:disabled {
            background-color: #555;
            color: #aaa;
            cursor: not-allowed;
        }

        /* Design för inställningar-sektionen */
        .settings-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }

        .settings-toggle {
            background-color: #0f3460;
            color: white;
            border: 2px solid #e94560;
            padding: 10px 15px;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .settings-toggle:hover {
            background-color: #e94560;
            transform: scale(1.1);
        }

        .settings-content {
            position: absolute;
            bottom: 70px;
            right: 0;
            background-color: #16213e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            width: 250px;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .settings-content.open {
            max-height: 300px;
            opacity: 1;
        }

        .settings-content label {
            color: #ccc;
        }

        .settings-content input[type="number"] {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #0f3460;
            background-color: #0f3460;
            color: white;
        }

        /* Placering av radioknappen nere till vänster */
        .music-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
        }

        /* Designen för knappen som öppnar radion */
        .music-toggle {
            background-color: #0f3460;
            color: white;
            border: 2px solid #e94560;
            padding: 10px 20px;
            border-radius: 30px; /* Rundad pill-form */
            font-size: 1.2em;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .music-toggle:hover {
            background-color: #e94560;
            transform: scale(1.05);
        }

        /* Själva rutan som fälls upp */
        .music-content {
            position: absolute;
            bottom: 60px;
            left: 0;
            background-color: #16213e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            width: 260px;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.3s ease;
            text-align: center;
        }

        /* Klassen som läggs på via JavaScript för att visa rutan */
        .music-content.open {
            max-height: 200px;
            opacity: 1;
        }

        /* --- Design för själva spelarens knappar inuti rutan --- */
        .custom-audio-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .radio-btn {
            background-color: #0f3460;
            color: white;
            padding: 8px 12px;
            font-size: 0.9em;
            display: flex;
            align-items: center;
        }

        .radio-btn:hover {
            background-color: #e94560;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #0f3460;
            padding: 8px 10px;
            border-radius: 5px;
        }

        #volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            background: transparent;
            cursor: pointer;
        }

        #volume-slider::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: #1a1a2e;
            border-radius: 3px;
        }

        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #e94560;
            margin-top: -4px;
        }
        .station-select {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 15px;
            background-color: #0f3460;
            color: white;
            border: 1px solid #e94560;
            border-radius: 5px;
            font-family: inherit; /* Använder samma snygga typsnitt som resten av sidan */
            font-size: 0.9em;
            cursor: pointer;
        }

        /* Lite ljusare kant när man klickar på menyn */
        .station-select:focus {
            outline: none;
            border-color: #ff5e78;
        }
    </style>
</head>
<body>
    <h1>Synkad Pomodoro</h1>
    <p class="subtitle">Gemensam Tidshantering för Grupper</p>
    
    <div class="room-controls">
        <input type="text" id="room-input" placeholder="Ange rumnamn (t.ex. grupp1)">
        <button id="join-btn">Gå med</button>
        <span id="current-room-text"></span>
    </div>

    <div class="music-container">
        <button id="music-toggle" class="music-toggle">🎧</button>
        
        <div id="music-content" class="music-content">
            <h3 style="margin: 0 0 15px 0; color: #ccc; font-size: 1.1em;">Fokusradio</h3>
            
            <select id="station-select" class="station-select">
                <option value="https://ice5.somafm.com/illstreet-128-mp3">Illinois Street Lounge (Jazz)</option>
                <option value="https://play.streamafrica.net/lofiradio">Chill Beats (Lo-Fi)</option>
                <option value="https://streaming.live365.com/a43749">New York (Jazz med reklam)</option>
                <option value="https://ice1.somafm.com/poptron-128-mp3">POP Tron (Fest)</option>
            </select>
            
            <audio id="focus-radio" preload="none">
                <source src="https://ice5.somafm.com/illstreet-128-mp3" type="audio/mpeg">
            </audio>

            <div class="custom-audio-controls">
                <button id="play-pause-btn" class="radio-btn">▶️ Spela</button>
                
                <div class="volume-container">
                    <span id="mute-btn" style="cursor: pointer;">🔊</span>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
                </div>
            </div>
        </div>
    </div>

    <div class="settings-container">
        <button id="settings-toggle" class="settings-toggle">⚙️</button>
        <div id="settings-content" class="settings-content">
            <div style="margin-bottom: 15px;">
                <label for="focus-duration" style="display: block; margin-bottom: 5px; text-align: left;">Fokustid (minuter):</label>
                <input type="number" id="focus-duration" min="1" max="60" value="25" style="width: 100%;">
            </div>
            <div>
                <label for="break-duration" style="display: block; margin-bottom: 5px; text-align: left;">Rasttid (minuter):</label>
                <input type="number" id="break-duration" min="1" max="30" value="5" style="width: 100%;">
            </div>
        </div>
    </div>

    <div class="timer-container">
        <h3 id="mode-display">Gå med i ett rum för att börja</h3>
        <h2 id="timer-display">25:00</h2>
        <button id="start-btn">Starta timer</button>
    </div>

    <audio id="alarm-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="script.js"></script>
    <script src="radio.js"></script>
</body>
</html>
